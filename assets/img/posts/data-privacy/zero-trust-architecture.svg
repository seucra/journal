<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f0e"/>
      <stop offset="100%" stop-color="#121a18"/>
    </linearGradient>
    <linearGradient id="cardGrad8" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#182320"/>
      <stop offset="100%" stop-color="#111816"/>
    </linearGradient>
    <marker id="arrow8" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#78e1a0" />
    </marker>
    <marker id="arrowControl" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#9cd1c6" />
    </marker>
    <filter id="shadow8" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="960" height="480" rx="16" fill="url(#bgGrad8)" stroke="#242e2c" stroke-width="1.5"/>

  <text x="480" y="44" text-anchor="middle" fill="#9cd1c6" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" letter-spacing="1">ZERO TRUST ARCHITECTURE (NIST SP 800-207)</text>
  <text x="480" y="68" text-anchor="middle" fill="#a2adaa" font-family="system-ui, -apple-system, sans-serif" font-size="12">De-perimeterized network security: "Never Trust, Always Verify" across all access requests</text>

  <!-- Left Column: Subject (User + Device) -->
  <g transform="translate(50, 100)" filter="url(#shadow8)">
    <rect width="210" height="230" rx="12" fill="url(#cardGrad8)" stroke="#78e1a0" stroke-width="1.5"/>
    <rect x="0" y="0" width="210" height="38" rx="12" fill="#1e2e29"/>
    <text x="105" y="24" text-anchor="middle" fill="#78e1a0" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Subject (Untrusted Zone)</text>
    
    <g transform="translate(15, 52)">
      <circle cx="20" cy="20" r="16" fill="#13231e" stroke="#78e1a0" stroke-width="1.2"/>
      <text x="20" y="25" text-anchor="middle" font-size="14">👤</text>
      <text x="48" y="16" fill="#dde8e4" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Identity Context</text>
      <text x="48" y="30" fill="#a2adaa" font-family="system-ui, sans-serif" font-size="9">FIDO2 / MFA Authenticated</text>
    </g>

    <g transform="translate(15, 105)">
      <circle cx="20" cy="20" r="16" fill="#13231e" stroke="#78e1a0" stroke-width="1.2"/>
      <text x="20" y="25" text-anchor="middle" font-size="14">💻</text>
      <text x="48" y="16" fill="#dde8e4" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Device Posture</text>
      <text x="48" y="30" fill="#a2adaa" font-family="system-ui, sans-serif" font-size="9">OS Patch, EDR healthy</text>
    </g>

    <g transform="translate(15, 158)">
      <rect width="180" height="52" rx="6" fill="#12251e" stroke="#2e5b49"/>
      <text x="90" y="20" text-anchor="middle" fill="#78e1a0" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Continuous Assessment</text>
      <text x="90" y="38" text-anchor="middle" fill="#cedcd1" font-family="monospace" font-size="8.5">Dynamic Risk Scoring</text>
    </g>
  </g>

  <!-- Middle Top: Policy Decision Point (PDP) - CONTROL PLANE -->
  <g transform="translate(340, 100)" filter="url(#shadow8)">
    <rect width="280" height="155" rx="12" fill="#152420" stroke="#9cd1c6" stroke-width="1.5"/>
    <rect x="0" y="0" width="280" height="34" rx="12" fill="#1b302a"/>
    <text x="140" y="22" text-anchor="middle" fill="#9cd1c6" font-family="system-ui, sans-serif" font-size="12" font-weight="700">CONTROL PLANE (PDP)</text>
    
    <g transform="translate(15, 45)">
      <rect width="115" height="55" rx="6" fill="#121e1a" stroke="#242e2c"/>
      <text x="57" y="22" text-anchor="middle" fill="#78e1a0" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Policy Engine</text>
      <text x="57" y="38" text-anchor="middle" fill="#a2adaa" font-family="system-ui, sans-serif" font-size="8.5">Access Decision</text>
    </g>

    <g transform="translate(145, 45)">
      <rect width="120" height="55" rx="6" fill="#121e1a" stroke="#242e2c"/>
      <text x="60" y="22" text-anchor="middle" fill="#9cd1c6" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Policy Admin</text>
      <text x="60" y="38" text-anchor="middle" fill="#a2adaa" font-family="system-ui, sans-serif" font-size="8.5">Token Issuance</text>
    </g>

    <text x="140" y="125" text-anchor="middle" fill="#cedcd1" font-family="monospace" font-size="9">Input: Threat Intel + RBAC Rules</text>
    <text x="140" y="142" text-anchor="middle" fill="#78e1a0" font-family="monospace" font-size="9">Rule: Least Privilege Access Only</text>
  </g>

  <!-- Middle Bottom: Policy Enforcement Point (PEP) - DATA PLANE -->
  <g transform="translate(340, 285)" filter="url(#shadow8)">
    <rect width="280" height="110" rx="12" fill="#1a2522" stroke="#78e1a0" stroke-width="2"/>
    <text x="140" y="28" text-anchor="middle" fill="#78e1a0" font-family="system-ui, sans-serif" font-size="13" font-weight="700">DATA PLANE (PEP)</text>
    <text x="140" y="48" text-anchor="middle" fill="#dde8e4" font-family="system-ui, sans-serif" font-size="11">Policy Enforcement Point</text>
    
    <rect x="20" y="60" width="240" height="36" rx="6" fill="#13231e" stroke="#2e5b49"/>
    <text x="120" y="78" text-anchor="middle" fill="#78e1a0" font-family="monospace" font-size="9.5">Applies Ephemeral Micro-Tunnels</text>
    <text x="120" y="90" text-anchor="middle" fill="#a2adaa" font-family="monospace" font-size="8">mTLS Session Gatekeeper</text>
  </g>

  <!-- Vertical Control Link: PDP to PEP -->
  <path d="M 480 255 L 480 285" stroke="#9cd1c6" stroke-width="2" marker-end="url(#arrowControl)"/>
  <text x="515" y="272" fill="#9cd1c6" font-family="system-ui, sans-serif" font-size="9" font-weight="600">Commands</text>

  <!-- Right Column: Micro-Segmented Resources -->
  <g transform="translate(700, 100)" filter="url(#shadow8)">
    <rect width="210" height="295" rx="12" fill="url(#cardGrad8)" stroke="#242e2c" stroke-width="1.5"/>
    <rect x="0" y="0" width="210" height="38" rx="12" fill="#192320"/>
    <text x="105" y="24" text-anchor="middle" fill="#9cd1c6" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Enterprise Resources</text>

    <!-- Resource 1 -->
    <g transform="translate(15, 50)">
      <rect width="180" height="52" rx="6" fill="#13231e" stroke="#78e1a0" stroke-width="1"/>
      <text x="90" y="22" text-anchor="middle" fill="#78e1a0" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600">Banking API Service</text>
      <text x="90" y="38" text-anchor="middle" fill="#cedcd1" font-family="monospace" font-size="8.5">mTLS + Token Validated</text>
    </g>

    <!-- Resource 2 -->
    <g transform="translate(15, 115)">
      <rect width="180" height="52" rx="6" fill="#13231e" stroke="#2e5b49"/>
      <text x="90" y="22" text-anchor="middle" fill="#9cd1c6" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600">Customer Records DB</text>
      <text x="90" y="38" text-anchor="middle" fill="#a2adaa" font-family="monospace" font-size="8.5">Strict RBAC Isolations</text>
    </g>

    <!-- Resource 3 -->
    <g transform="translate(15, 180)">
      <rect width="180" height="52" rx="6" fill="#13231e" stroke="#2e5b49"/>
      <text x="90" y="22" text-anchor="middle" fill="#9cd1c6" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600">Core Ledger Vault</text>
      <text x="90" y="38" text-anchor="middle" fill="#a2adaa" font-family="monospace" font-size="8.5">HSM Cryptographic Keys</text>
    </g>

    <text x="105" y="260" text-anchor="middle" fill="#78e1a0" font-family="system-ui, sans-serif" font-size="9" font-weight="600">Micro-Segmented Boundaries</text>
    <text x="105" y="276" text-anchor="middle" fill="#a2adaa" font-family="system-ui, sans-serif" font-size="8.5">No Lateral Movement Allowed</text>
  </g>

  <!-- Data Plane Arrows -->
  <path d="M 260 340 L 340 340" stroke="#78e1a0" stroke-width="2.5" marker-end="url(#arrow8)"/>
  <path d="M 620 340 L 700 340" stroke="#78e1a0" stroke-width="2.5" marker-end="url(#arrow8)"/>

  <!-- Footer -->
  <g transform="translate(50, 420)">
    <rect width="860" height="42" rx="8" fill="#131b19" stroke="#242e2c" stroke-width="1"/>
    <text x="430" y="26" text-anchor="middle" fill="#dde8e4" font-family="system-ui, sans-serif" font-size="11"><tspan font-weight="600" fill="#78e1a0">Zero Trust Philosophy:</tspan> Network location no longer implies trust. Every session requires explicit authorization and continuous telemetry.</text>
  </g>
</svg>
