<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f0e"/>
      <stop offset="100%" stop-color="#121a18"/>
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#182320"/>
      <stop offset="100%" stop-color="#111816"/>
    </linearGradient>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="960" height="440" rx="16" fill="url(#bgGrad2)" stroke="#242e2c" stroke-width="1.5"/>

  <text x="480" y="44" text-anchor="middle" fill="#9cd1c6" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" letter-spacing="1">THE CIA TRIAD: CORNERSTONES OF INFORMATION SECURITY</text>
  <text x="480" y="68" text-anchor="middle" fill="#a2adaa" font-family="system-ui, -apple-system, sans-serif" font-size="12">Balancing confidentiality, data integrity, and system availability in modern networks</text>

  <!-- Connecting Lines -->
  <line x1="200" y1="210" x2="480" y2="210" stroke="#2e5b49" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="760" y1="210" x2="480" y2="210" stroke="#2e5b49" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="480" y1="210" x2="480" y2="350" stroke="#2e5b49" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Center Badge: Security Core -->
  <circle cx="480" cy="210" r="46" fill="#13231e" stroke="#78e1a0" stroke-width="2" filter="url(#shadow2)"/>
  <text x="480" y="206" text-anchor="middle" fill="#78e1a0" font-family="system-ui, sans-serif" font-size="11" font-weight="700">SECURITY</text>
  <text x="480" y="222" text-anchor="middle" fill="#9cd1c6" font-family="system-ui, sans-serif" font-size="11" font-weight="700">CORE</text>

  <!-- Pillar 1: Confidentiality -->
  <g transform="translate(60, 100)" filter="url(#shadow2)">
    <rect width="270" height="230" rx="12" fill="url(#cardGrad2)" stroke="#78e1a0" stroke-width="1.5"/>
    <rect x="0" y="0" width="270" height="42" rx="12" fill="#1e2e29"/>
    <circle cx="28" cy="21" r="12" fill="#13231e" stroke="#78e1a0" stroke-width="1.5"/>
    <text x="28" y="26" text-anchor="middle" fill="#78e1a0" font-size="12">🔒</text>
    <text x="50" y="26" fill="#78e1a0" font-family="system-ui, sans-serif" font-size="14" font-weight="700">CONFIDENTIALITY</text>
    
    <text x="20" y="68" fill="#dde8e4" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Goal: Prevent Unauthorized Disclosure</text>
    <text x="20" y="88" fill="#a2adaa" font-family="system-ui, sans-serif" font-size="11">Ensures information remains private to intended entities.</text>
    
    <line x1="20" y1="102" x2="250" y2="102" stroke="#242e2c" stroke-width="1"/>
    
    <text x="20" y="122" fill="#9cd1c6" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Key Mechanisms:</text>
    <text x="30" y="142" fill="#dde8e4" font-family="monospace" font-size="10.5">• TLS 1.3 / AES-256-GCM</text>
    <text x="30" y="162" fill="#dde8e4" font-family="monospace" font-size="10.5">• End-to-End Encryption (E2EE)</text>
    <text x="30" y="182" fill="#dde8e4" font-family="monospace" font-size="10.5">• Role-Based Access Control</text>
    <text x="30" y="202" fill="#dde8e4" font-family="monospace" font-size="10.5">• Data Masking &amp; Tokenization</text>
  </g>

  <!-- Pillar 2: Integrity -->
  <g transform="translate(630, 100)" filter="url(#shadow2)">
    <rect width="270" height="230" rx="12" fill="url(#cardGrad2)" stroke="#9cd1c6" stroke-width="1.5"/>
    <rect x="0" y="0" width="270" height="42" rx="12" fill="#192522"/>
    <circle cx="28" cy="21" r="12" fill="#131b19" stroke="#9cd1c6" stroke-width="1.5"/>
    <text x="28" y="26" text-anchor="middle" fill="#9cd1c6" font-size="12">🛡️</text>
    <text x="50" y="26" fill="#9cd1c6" font-family="system-ui, sans-serif" font-size="14" font-weight="700">INTEGRITY</text>
    
    <text x="20" y="68" fill="#dde8e4" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Goal: Prevent Tampering &amp; Alteration</text>
    <text x="20" y="88" fill="#a2adaa" font-family="system-ui, sans-serif" font-size="11">Guarantees data is accurate, complete, and uncorrupted.</text>
    
    <line x1="20" y1="102" x2="250" y2="102" stroke="#242e2c" stroke-width="1"/>
    
    <text x="20" y="122" fill="#9cd1c6" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Key Mechanisms:</text>
    <text x="30" y="142" fill="#dde8e4" font-family="monospace" font-size="10.5">• Cryptographic Hashes (SHA-256)</text>
    <text x="30" y="162" fill="#dde8e4" font-family="monospace" font-size="10.5">• HMAC &amp; Digital Signatures</text>
    <text x="30" y="182" fill="#dde8e4" font-family="monospace" font-size="10.5">• TCP Checksums &amp; Sequence IDs</text>
    <text x="30" y="202" fill="#dde8e4" font-family="monospace" font-size="10.5">• Immutable Audit Logs</text>
  </g>

  <!-- Pillar 3: Availability -->
  <g transform="translate(345, 275)" filter="url(#shadow2)">
    <rect width="270" height="145" rx="12" fill="url(#cardGrad2)" stroke="#2e5b49" stroke-width="1.5"/>
    <rect x="0" y="0" width="270" height="38" rx="12" fill="#16221f"/>
    <circle cx="26" cy="19" r="11" fill="#131b19" stroke="#9cd1c6" stroke-width="1.5"/>
    <text x="26" y="24" text-anchor="middle" fill="#9cd1c6" font-size="11">⚡</text>
    <text x="46" y="24" fill="#9cd1c6" font-family="system-ui, sans-serif" font-size="13" font-weight="700">AVAILABILITY</text>
    
    <text x="18" y="58" fill="#dde8e4" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Goal: Ensure Timely System Access</text>
    <text x="18" y="74" fill="#a2adaa" font-family="system-ui, sans-serif" font-size="10">Systems remain operational under peak load or attack.</text>
    
    <text x="18" y="98" fill="#dde8e4" font-family="monospace" font-size="9.5">• DDoS Shielding &amp; Anycast DNS</text>
    <text x="18" y="114" fill="#dde8e4" font-family="monospace" font-size="9.5">• Multi-Region Redundancy &amp; Auto-failover</text>
    <text x="18" y="130" fill="#dde8e4" font-family="monospace" font-size="9.5">• Resilient Hardware &amp; Active Backups</text>
  </g>
</svg>
