<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f0e"/>
      <stop offset="100%" stop-color="#121a18"/>
    </linearGradient>
    <linearGradient id="cardGrad6" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#182320"/>
      <stop offset="100%" stop-color="#111816"/>
    </linearGradient>
    <marker id="arrowRight6" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#78e1a0" />
    </marker>
    <marker id="arrowLeft6" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#9cd1c6" />
    </marker>
    <filter id="shadow6" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="960" height="480" rx="16" fill="url(#bgGrad6)" stroke="#242e2c" stroke-width="1.5"/>

  <text x="480" y="44" text-anchor="middle" fill="#9cd1c6" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" letter-spacing="1">TLS 1.3 PROTOCOL HANDSHAKE &amp; RECORD ENCRYPTION</text>
  <text x="480" y="68" text-anchor="middle" fill="#a2adaa" font-family="system-ui, -apple-system, sans-serif" font-size="12">Zero-round-trip/1-RTT key exchange using Ephemeral Diffie-Hellman (RFC 8446)</text>

  <!-- Left Column: Client Lifeline -->
  <g transform="translate(140, 100)">
    <rect width="160" height="42" rx="8" fill="url(#cardGrad6)" stroke="#78e1a0" stroke-width="1.5"/>
    <text x="80" y="26" text-anchor="middle" fill="#78e1a0" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Alice (Browser)</text>
    <line x1="80" y1="42" x2="80" y2="350" stroke="#2e5b49" stroke-width="2" stroke-dasharray="4,4"/>
  </g>

  <!-- Right Column: Server Lifeline -->
  <g transform="translate(660, 100)">
    <rect width="160" height="42" rx="8" fill="url(#cardGrad6)" stroke="#9cd1c6" stroke-width="1.5"/>
    <text x="80" y="26" text-anchor="middle" fill="#9cd1c6" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Bank Server</text>
    <line x1="80" y1="42" x2="80" y2="350" stroke="#2e5b49" stroke-width="2" stroke-dasharray="4,4"/>
  </g>

  <!-- Handshake Messages -->
  <!-- 1. ClientHello -->
  <g transform="translate(220, 160)">
    <line x1="0" y1="0" x2="520" y2="25" stroke="#78e1a0" stroke-width="2" marker-end="url(#arrowRight6)"/>
    <rect x="140" y="-14" width="240" height="26" rx="6" fill="#182922" stroke="#78e1a0" stroke-width="1"/>
    <text x="260" y="4" text-anchor="middle" fill="#78e1a0" font-family="monospace" font-size="10.5">ClientHello + KeyShare (ECDHE)</text>
  </g>

  <!-- 2. ServerHello -->
  <g transform="translate(220, 225)">
    <line x1="520" y1="0" x2="0" y2="25" stroke="#9cd1c6" stroke-width="2" marker-end="url(#arrowLeft6)"/>
    <rect x="110" y="-14" width="300" height="38" rx="6" fill="#152421" stroke="#9cd1c6" stroke-width="1"/>
    <text x="260" y="2" text-anchor="middle" fill="#9cd1c6" font-family="monospace" font-size="10.5">ServerHello + KeyShare + CertVerify</text>
    <text x="260" y="17" text-anchor="middle" fill="#cedcd1" font-family="monospace" font-size="9">{Finished, Certificate} [Encrypted]</text>
  </g>

  <!-- Derived Session Keys Callout -->
  <g transform="translate(260, 285)">
    <rect width="440" height="42" rx="8" fill="#1e2d26" stroke="#78e1a0" stroke-width="1.5" filter="url(#shadow6)"/>
    <text x="220" y="20" text-anchor="middle" fill="#78e1a0" font-family="system-ui, sans-serif" font-size="11" font-weight="700">🔑 EPHEMERAL SYMMETRIC KEYS COMPUTED INDEPENDENTLY</text>
    <text x="220" y="34" text-anchor="middle" fill="#cedcd1" font-family="monospace" font-size="9.5">Shared Secret K derived locally via Elliptic Curve Diffie-Hellman (PFS)</text>
  </g>

  <!-- 3. Encrypted Application Data Tunnel -->
  <g transform="translate(220, 350)">
    <!-- Shaded bidirectional tunnel -->
    <rect x="0" y="-8" width="520" height="44" rx="8" fill="#13231e" stroke="#78e1a0" stroke-width="1.5" stroke-dasharray="6,4"/>
    <line x1="0" y1="8" x2="520" y2="8" stroke="#78e1a0" stroke-width="2" marker-end="url(#arrowRight6)"/>
    <line x1="520" y1="22" x2="0" y2="22" stroke="#9cd1c6" stroke-width="2" marker-end="url(#arrowLeft6)"/>
    <text x="260" y="5" text-anchor="middle" fill="#78e1a0" font-family="system-ui, sans-serif" font-size="10" font-weight="700">🔒 SECURE APPLICATION DATA (AES-256-GCM / CHACHA20-POLY1305)</text>
  </g>

  <!-- Bottom Explanatory Banner -->
  <g transform="translate(60, 415)">
    <rect width="840" height="45" rx="8" fill="#131b19" stroke="#242e2c" stroke-width="1"/>
    <text x="420" y="27" text-anchor="middle" fill="#dde8e4" font-family="system-ui, sans-serif" font-size="11"><tspan font-weight="600" fill="#78e1a0">Perfect Forward Secrecy (PFS):</tspan> Even if the server's long-term private key is compromised in the future, past sessions cannot be decrypted.</text>
  </g>
</svg>
